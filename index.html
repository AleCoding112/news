<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News</title>
<meta name="description" content="Le notizie che contano, con i criteri scritti in chiaro.">
<meta name="theme-color" content="#12120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- ============ libreria icone ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-cerca" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></symbol>
  <symbol id="i-chiudi" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-su" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></symbol>
  <symbol id="i-giu" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></symbol>
  <symbol id="i-catena" viewBox="0 0 24 24"><path d="M9.5 14.5 14.5 9.5"/><path d="M12.8 7.6 14.9 5.5a3.6 3.6 0 0 1 5.1 5.1l-2.1 2.1"/><path d="M11.2 16.4 9.1 18.5a3.6 3.6 0 0 1-5.1-5.1l2.1-2.1"/></symbol>
  <symbol id="i-fonte" viewBox="0 0 24 24"><path d="M14 4h-8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8z"/><path d="M14 4v6h6"/><path d="M8.5 13.5h7M8.5 16.5h4.5"/></symbol>
  <symbol id="i-dubbio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 16.6v.01"/><path d="M9.7 9.6a2.4 2.4 0 0 1 4.6.8c0 1.6-2.3 2-2.3 3.4"/></symbol>
  <symbol id="i-diverge" viewBox="0 0 24 24"><path d="M5 5v3.2a4 4 0 0 0 1.6 3.2l10.8 8a4 4 0 0 1 1.6 3.2V19"/><path d="M19 5v3.2a4 4 0 0 1-1.6 3.2l-10.8 8A4 4 0 0 0 5 22.6V19"/></symbol>
  <symbol id="i-perche" viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></symbol>
  <symbol id="i-cifre" viewBox="0 0 24 24"><path d="M4 19V9M9.5 19V5M15 19v-7M20.5 19v-4"/></symbol>
  <symbol id="i-tema" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
  <symbol id="i-letti" viewBox="0 0 24 24"><path d="M3 12.5l4.5 4.5L14 8"/><path d="M12.5 15.5L15 18l6-9"/></symbol>
  <symbol id="i-calendario" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4"/></symbol>
  <symbol id="i-dossier" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-mira" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></symbol>
  <symbol id="i-densita" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</defs></svg>

<header class="testata">
  <div class="dentro">
    <div class="marchio">
      <svg class="segno" viewBox="0 0 40 40" aria-hidden="true">
        <rect class="s-off" x="4"  y="9"  width="32" height="3" rx="1.5"/>
        <rect class="s-off" x="4"  y="16" width="24" height="3" rx="1.5"/>
        <rect class="s-on"  x="4"  y="23" width="32" height="3" rx="1.5"/>
        <rect class="s-off" x="4"  y="30" width="19" height="3" rx="1.5"/>
      </svg>
      <div class="nome">
        <h1>News</h1>
        <p class="claim" id="claim">Le notizie che contano, con i criteri scritti in chiaro</p>
      </div>
    </div>
    <button class="tema" id="btn-tema" type="button" title="Chiaro o scuro" aria-label="Cambia tema">
      <svg><use href="#i-tema"/></svg>
    </button>
  </div>

  <!-- i numeri veri, dalle fonti statistiche primarie. Toccarne uno
       apre la sua storia: un numero senza storia non informa. -->
  <div class="macro" id="macro" hidden></div>
  <div class="storia-aperta" id="storia" hidden></div>
</header>

<nav class="sezioni" id="sezioni" hidden>
  <button type="button" data-sez="flusso"     aria-pressed="true">Flusso<span class="pallino" id="conta-nuovi" hidden></span></button>
  <button type="button" data-sez="arrivo"     aria-pressed="false">In arrivo</button>
  <button type="button" data-sez="dossier"    aria-pressed="false">Dossier</button>
  <button type="button" data-sez="previsioni" aria-pressed="false">Previsioni</button>
</nav>

<div class="filtri" id="filtri" hidden>
  <div class="cerca">
    <svg class="lente" aria-hidden="true"><use href="#i-cerca"/></svg>
    <input type="search" id="cerca" placeholder="Cerca fra i pezzi" autocomplete="off" spellcheck="false">
    <button type="button" id="pulisci" hidden aria-label="Pulisci"><svg><use href="#i-chiudi"/></svg></button>
    <button type="button" id="densita" title="Una riga per pezzo" aria-label="Cambia densità"><svg><use href="#i-densita"/></svg></button>
    <button type="button" id="segna-letti" title="Segna tutti come letti" aria-label="Segna tutti come letti"><svg><use href="#i-letti"/></svg></button>
  </div>
  <div class="pastiglie" id="pastiglie"></div>
</div>

<main id="palco" class="palco" aria-live="polite">
  <p class="attesa">Carico…</p>
</main>

<footer class="chiusa" id="chiusa" hidden>
  <p>I criteri di selezione stanno in <code>LINEA-EDITORIALE.md</code>. Se un pezzo non è servito,
     la riga da correggere è lì.</p>
  <p class="quando" id="aggiornato"></p>
</footer>

<script src="./app.js"></script>
</body>
</html>
